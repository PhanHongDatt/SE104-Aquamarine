version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quan_ly_vang_bac_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vangbac_db
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d vangbac_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: quan_ly_vang_bac_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/vangbac_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=vangbac-secret-local-dev-1234
      - PRISMA_SKIP_POSTINSTALL_GENERATE=true
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
