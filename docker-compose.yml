version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: quan_ly_vang_bac_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: vangbac_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  app:
    build:
      context: ./fe
      dockerfile: Dockerfile
    container_name: quan_ly_vang_bac_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/vangbac_db?schema=public
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=vangbac-secret-local-dev-1234
    depends_on:
      - db

volumes:
  db_data:
